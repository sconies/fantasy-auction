name: Test Jev on labelled injury notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/jev-injuries.mjs --test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || 'apikey_2116b470346b88e1453885dbaa658510538e_b107ca01bd947cebe0bda5b8454009e37805f460a6715a9f5d9a6692ab58b970' }}  # owner chose to commit the key (cheap, private repo); a repo secret overrides it
      - run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add data/jev
          git diff --cached --quiet || git commit -m "Jev injury test results"
          git pull --rebase && git push
