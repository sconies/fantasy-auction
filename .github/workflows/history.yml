name: Fetch weekly history (for the H2H simulation)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: writes-to-main
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/fetch-weekly.mjs 2026 2025 2024
      - run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "Weekly history from ESPN game logs"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          echo "push failed after 4 tries"; exit 1
