name: Refresh stats and news

on:
  schedule:
    - cron: '17 */6 * * *'   # every six hours: projections, depth charts and injuries move daily in preseason
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Last two seasons' stats (once a day is plenty)
        run: |
          if [ ! -f data/raw/bbref-2026.json ] || [ "$(date -u +%H)" -lt 6 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/fetch-stats.mjs 2026 2025
          fi
      - name: ESPN projections, rosters and depth charts; FantasyPros consensus
        run: node scripts/fetch-sources.mjs
      - name: Build projections (fails if a source came back thin)
        run: node scripts/build-players.mjs
      - name: News and injuries
        run: node scripts/fetch-news.mjs
      - name: Jev reads new injury notes (skipped until the TYPESAFE_API_KEY secret exists)
        run: node scripts/jev-injuries.mjs --run --if-key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%F\ %H:%M)"
          git push
