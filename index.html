<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Auction Board</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <div class="brand">Auction Board <span id="meta" class="muted"></span></div>
  <nav id="tabs">
    <button data-tab="ranks" class="on">Ranks</button>
    <button data-tab="draft">Draft</button>
    <button data-tab="news">News <span id="newsBadge" class="badge" hidden></span></button>
    <button data-tab="settings">Setup</button>
  </nav>
</header>
<main id="view"></main>
<div id="sheet" class="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
